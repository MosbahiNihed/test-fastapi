services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5433}:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs pending changesets once, then exits. The app waits for it to succeed.
  liquibase:
    build: ./db
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-app}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-app}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_CONTEXTS:-dev}
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      ENVIRONMENT: docker
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      liquibase:
        condition: service_completed_successfully

volumes:
  pgdata:
  pgadmin:
